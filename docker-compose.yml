services:
   api:
     image: scratch2devops/task-tracker-platform:${IMAGE_TAG:-2}
     ports:
        - "8002:8000"

     environment:
       DATABASE_URL: postgresql+psycopg://task_tracker:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:5432/task_tracker_db
       APP_NAME: "Task Tracker API"
       LOG_LEVEL: INFO
       REDIS_URL: redis://redis:6379/0
     mem_limit: 512m
     cpus: 1.0


     depends_on:
       db:
          condition: service_healthy
       redis:
          condition: service_healthy

     restart : unless-stopped
    
     healthcheck:
        test:
          - CMD
          - python
          - -c
          - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
        interval: 30s
        timeout: 5s
        retries: 3
        start_period: 10s
          

   db:
     image: postgres:17
     container_name: task_tracker_db
     environment:
        POSTGRES_DB: task_tracker_db
        POSTGRES_USER: task_tracker
        POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
     volumes: 
        - db_data:/var/lib/postgresql/data

     healthcheck:
       test: ["CMD-SHELL", "pg_isready -U task_tracker -d task_tracker_db"]
       interval: 30s
       timeout: 5s
       retries: 10
     restart: unless-stopped
      
         
   redis:
     image: redis:7-alpine
     container_name: task_tracker_redis
     
     healthcheck:
       test: ["CMD", "redis-cli", "ping"] 
       interval: 30s
       timeout: 5s
       retries: 5
     restart: unless-stopped
  
volumes:
     db_data:
